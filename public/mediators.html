let currentFilter = "ALL";
let sentState = JSON.parse(localStorage.getItem("zonus_adr_sent") || "{}");

function updateSentCounter() {
  const sentCount = Object.keys(sentState).filter(k => sentState[k]).length;
  document.getElementById("sentCounter").innerText = sentCount + " / " + leads.length;
}

function resetAllSent() {
  if (confirm("Сбросить все отметки об отправке?")) {
    sentState = {};
    localStorage.removeItem("zonus_adr_sent");
    updateSentCounter();
    renderCards();
  }
}

function toggleSent(id) {
  sentState[id] = !sentState[id];
  localStorage.setItem("zonus_adr_sent", JSON.stringify(sentState));
  updateSentCounter();
  renderCards();
}

function setFilter(tz) {
  currentFilter = tz;
  document.querySelectorAll(".tz-btn").forEach(b => b.classList.remove("active"));
  const btn = document.getElementById("btn-" + tz);
  if (btn) btn.classList.add("active");
  renderCards();
}

function copyToClipboard(text, btnElement, successText) {
  navigator.clipboard.writeText(text).then(() => {
    const orig = btnElement.innerHTML;
    btnElement.innerHTML = successText || "✓ Скопировано!";
    btnElement.classList.add("bg-emerald-600", "text-white");
    setTimeout(() => {
      btnElement.innerHTML = orig;
      btnElement.classList.remove("bg-emerald-600", "text-white");
    }, 1800);
  });
}

function openMailClient(item) {
  const subject = encodeURIComponent(item.subject);
  const body = encodeURIComponent(generateEmailBody(item));
  window.open(`mailto:${item.email}?subject=${subject}&body=${body}`, "_blank");
  sentState[item.id] = true;
  localStorage.setItem("zonus_adr_sent", JSON.stringify(sentState));
  updateSentCounter();
  renderCards();
}

              <h2 class="font-bold text-lg text-white">${item.name}</h2>
              <span class="text-[11px] font-mono px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">${item.id}</span>
              <span class="text-[11px] font-bold px-2 py-0.5 rounded ${item.state === 'CA' ? 'bg-indigo-900/60 text-indigo-300 border-indigo-700/50' : item.state === 'FL' ? 'bg-amber-900/60 text-amber-300 border-amber-700/50' : 'bg-rose-900/60 text-rose-300 border-rose-700/50'} border">${item.city}, ${item.state} (${item.tz})</span>
              <span class="status-badge text-[11px] font-bold px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700">
                ${isSent ? "✓ ОТПРАВЛЕНО" : "ОЖИДАЕТ"}
              </span>
            </div>
            <p class="text-xs text-slate-400 mt-1">${item.ru_context}</p>
          </div>
        </div>

        <!-- Direct Links & Toggle Sent -->
        <div class="flex items-center gap-2 shrink-0">
          <a href="https://zonus.co/${item.slug}" target="_blank" class="px-2.5 py-1 text-xs font-semibold rounded-lg bg-rose-950/60 text-rose-300 border border-rose-800/60 hover:bg-rose-900/80 transition flex items-center gap-1">
            <span>🇺🇸 Лендинг (EN)</span> ↗
          </a>
          <a href="https://zonus.co/${item.slug}-ru" target="_blank" class="px-2.5 py-1 text-xs font-semibold rounded-lg bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700 transition flex items-center gap-1">
            <span>🇷🇺 Проверка (RU)</span> ↗
          </a>
          <button onclick="toggleSent('${item.id}')" class="p-1.5 rounded-lg border text-xs font-mono ${isSent ? 'border-emerald-600 bg-emerald-950/40 text-emerald-300' : 'border-slate-700 text-slate-400 hover:text-slate-200'}">
            ${isSent ? '✓ Снять отметку' : 'Отметить'}
          </button>
        </div>
      </div>

      <!-- Contact Bar -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4 text-xs font-mono">
        <div class="bg-slate-950/80 p-2.5 rounded-xl border border-slate-800/80 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="text-slate-500">Email:</span>
            <span class="text-slate-200 font-semibold select-all">${item.email}</span>
          </div>
          <button onclick="copyToClipboard('${item.email}', this, '✓')" class="text-[11px] px-2 py-0.5 rounded bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Копировать</button>
        </div>
        <div class="bg-slate-950/80 p-2.5 rounded-xl border border-slate-800/80 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="text-slate-500">Телефон:</span>
            <span class="text-slate-200 font-semibold select-all">${item.phone}</span>
          </div>
          <a href="tel:${item.clean_phone}" class="text-[11px] px-2 py-0.5 rounded bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Позвонить</a>
        </div>
      </div>

      <!-- Action Row: Subject & Email Copiers -->
      <div class="flex items-center justify-between gap-3 flex-wrap mb-3">
        <div class="flex items-center gap-2 flex-1 min-w-[280px]">
          <span class="text-xs text-slate-400 font-semibold shrink-0">Тема:</span>
          <div class="bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800 text-xs text-rose-300 font-mono truncate flex-1 select-all">
            ${item.subject}
          </div>
          <button onclick="copyToClipboard('${item.subject.replace(/'/g, "\'")}', this, '✓ Тема скопирована')" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-slate-800 text-slate-200 hover:bg-slate-700 border border-slate-700 transition shrink-0">
            Копировать тему
          </button>
        </div>

        <div class="flex items-center gap-2">
          <button onclick="copyToClipboard(generateEmailBody(leads.find(l => l.id === '${item.id}')), this, '✓ Текст в буфере!')" class="px-4 py-1.5 text-xs font-bold rounded-lg bg-rose-600 hover:bg-rose-500 text-white shadow-md shadow-rose-950/50 transition flex items-center gap-1.5">
            📋 Скопировать весь текст письма
          </button>
          <button onclick="openMailClient(leads.find(l => l.id === '${item.id}'))" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition flex items-center gap-1.5">
            ✉️ Открыть в Почте
          </button>
        </div>
      </div>

      <!-- Collapsible Text Preview -->
      <details class="text-xs text-slate-400">
        <summary class="cursor-pointer hover:text-slate-200 font-semibold text-[11px] uppercase tracking-wider text-slate-500 py-1">
          Показать готовый текст письма для вставки
        </summary>
        <div class="mt-2 p-3 bg-slate-950 rounded-xl border border-slate-800 font-mono text-[12px] text-slate-300 whitespace-pre-line leading-relaxed select-all">
          ${emailBody}
        </div>
      </details>
    `;

    container.appendChild(card);
  });
}

function updateUSTime() {
  const now = new Date();
  const et = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hour: "numeric", minute: "numeric", second: "numeric", hour12: true }).format(now);
  const ct = new Intl.DateTimeFormat("en-US", { timeZone: "America/Chicago", hour: "numeric", minute: "numeric", second: "numeric", hour12: true }).format(now);
  const pt = new Intl.DateTimeFormat("en-US", { timeZone: "America/Los_Angeles", hour: "numeric", minute: "numeric", second: "numeric", hour12: true }).format(now);

  document.getElementById("usTimeDisplay").innerText = `ET: ${et} | CT: ${ct} | PT: ${pt}`;
}

setInterval(updateUSTime, 1000);
updateUSTime();
updateSentCounter();
renderCards();
</script>
</body>
</html>
